version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    # `build(deps):` for a runtime dependency, which users install, so its
    # merge makes a release (the gate in release-please.yml);
    # `build(deps-dev):` for the rest, which does not.
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # @types/node major versions track the Node.js major. Pin to the
      # lowest supported runtime (Node 22 per package.json engines) so
      # types reflect what's actually available on every supported version.
      # Allow updates within the v22.x line; ignore v23+.
      - dependency-name: "@types/node"
        versions: [">=23"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        update-types:
          - minor
          - patch
