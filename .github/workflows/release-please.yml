name: release-please

on:
  push:
    branches: [main]
  # The gate below runs release-please only for a push that carries a commit
  # users get, so a release pull request it has already opened is not
  # refreshed by a docs or ci merge, and a config change is exactly such a
  # merge. This trigger re-runs it on demand, which is what rewrites an
  # outstanding release pull request against the current configuration.
  workflow_dispatch:

permissions: {}

jobs:
  # GitHub's release notes are never empty, so release-please would propose
  # a release after every merge, a docs or ci change included. Only a push
  # carrying a change users get, or the merge of the release PR itself,
  # which is what creates the tag, goes on to it.
  #
  # Every commit in the push is checked, so a merge commit's PR commits count
  # through their own subjects. A breaking change counts whatever its type, a
  # `revert:` because what it undoes has shipped, and a `Release-As:` footer,
  # matched in any case as release-please does, because it asks for a release
  # on any subject. `build(deps):` is a bump of a runtime dependency, which
  # users install; dependabot.yml gives dev dependencies `build(deps-dev):`
  # and actions `ci(deps):`, and neither matches. GitHub's own `Revert "…"`
  # subject is not conventional, so release-please ignores it and it is not
  # let through here either. The last alternative is the release PR's own
  # title, pull-request-title-pattern in release-please-config.json, and must
  # change with it, or the release PR's merge is judged non-releasable and no
  # tag is ever created. The payload holds at most 2048 commits, so a push
  # that fills it may hide more and is let through.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      releasable: ${{ steps.check.outputs.releasable }}
    steps:
      # A manual run carries no commits to judge, and asking for one is the
      # statement that it should happen, so it bypasses the check below
      # rather than being skipped by it for having an empty payload.
      - id: check
        env:
          DISPATCHED: ${{ github.event_name == 'workflow_dispatch' }}
          MESSAGES: ${{ toJSON(github.event.commits.*.message) }}
          RELEASABLE: '^((feat|fix|perf|revert)(\([^)]*\))?!?: |[a-z]+(\([^)]*\))?!: |build\(deps\): |chore\(release\): v?[0-9])'
        run: |
          if [ "$DISPATCHED" = true ]; then
            echo "releasable=true" >> "$GITHUB_OUTPUT"
            echo "Run requested manually; release-please not gated."
            exit 0
          fi
          if jq -e --arg re "$RELEASABLE" '(length >= 2048) or ([.[] | (split("\n")[0] | test($re)) or test("\nBREAKING[- ]CHANGE: ") or test("\nrelease-as: "; "i")] | any)' <<< "$MESSAGES" > /dev/null; then
            echo "releasable=true" >> "$GITHUB_OUTPUT"
          else
            echo "releasable=false" >> "$GITHUB_OUTPUT"
            echo "No releasable commit in this push; release-please not run."
          fi

  release-please:
    needs: gate
    if: ${{ needs.gate.outputs.releasable == 'true' }}
    # One release-please at a time: two runs, a push and a manual run say,
    # could both find the merged release PR untagged and both try to create
    # its release. Never cancelled in progress, since a run may be creating
    # the tag. A queued run that a newer one replaces loses nothing, because
    # every run tags whatever merged release PR is still untagged and builds
    # the open one from the whole range. A run the gate stopped gets a group
    # of its own, so it can never displace a queued run that has work to do.
    concurrency:
      group: ${{ needs.gate.outputs.releasable == 'true' && 'release-please' || format('release-please-{0}', github.run_id) }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      # release-please creates its `autorelease: pending` / `autorelease:
      # tagged` labels through the issues API the first time it needs them.
      issues: write
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: rp

  # The tag release-please just pushed does not start publish.yml by itself:
  # an event raised with GITHUB_TOKEN starts no workflow, with
  # workflow_dispatch as the exception. So publish.yml is dispatched on the
  # tag. It has to stay the file that publishes, since npm's trusted
  # publishing is bound to that workflow file. This is its own job, so that
  # the right to start workflows is held by nothing but this one command.
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.releases_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG"
